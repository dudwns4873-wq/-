<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>투자 목표 트래커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root {
    --bg:#0f1117;--bg2:#181c27;--bg3:#1e2333;--card:#242840;
    --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
    --text:#eef0f8;--text2:#8b90a8;--text3:#555a72;
    --accent:#4ade9a;--accent2:#3bc47f;--amber:#f5a623;--blue:#5b8fff;--red:#ff5f6d;
    --radius:14px;--radius-sm:8px;
    --font:'Noto Sans KR',sans-serif;--mono:'DM Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}
  .app{max-width:480px;margin:0 auto;padding:0 0 100px;} /* 하단 패딩을 넉넉히 주어 탭바에 콘텐츠가 가려지지 않게 조절 */
  .header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;}
  .header h1{font-size:18px;font-weight:700;letter-spacing:-.3px;}
  .header-sub{font-size:12px;color:var(--text3);margin-top:2px;}
  
  /* 탭바가 사라지지 않도록 모바일 브라우저 툴바 위로 완벽하게 고정 */
  .tabbar{
    position:fixed;
    bottom:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:480px;
    background:var(--bg2);
    border-top:1px solid var(--border);
    display:flex;
    z-index:9999; /* 다른 요소보다 무조건 위에 오도록 설정 */
    /* 아이폰 노치/홈 바 영역 보정 및 최소 패딩 확보 */
    padding-bottom: calc(env(safe-area-inset-bottom) + 8px);
    padding-top: 8px;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.4);
  }
  
  .tab-btn{flex:1;padding:6px 4px;border:none;background:none;color:var(--text3);font-family:var(--font);font-size:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:color .2s;}
  .tab-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .tab-btn.active{color:var(--accent);}
  .page{display:none;padding:20px;}
  .page.active{display:block;}
  .section-title{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin:24px 0 10px;}
  .gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:28px 0 20px;}
  .gauge-ring{position:relative;width:180px;height:180px;}
  .gauge-ring svg{transform:rotate(-90deg);}
  .gauge-ring circle{transition:stroke-dashoffset 1s cubic-bezier(.4,0,.2,1);}
  .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge-pct{font-family:var(--mono);font-size:36px;font-weight:500;color:var(--text);line-height:1;}
  .gauge-label{font-size:11px;color:var(--text3);margin-top:4px;}
  .gap-badge{margin-top:14px;padding:7px 18px;border-radius:999px;font-size:13px;font-weight:500;}
  .gap-badge.gap-neg{background:rgba(255,95,109,0.12);color:var(--red);border:1px solid rgba(255,95,109,0.25);}
  .gap-badge.gap-pos{background:rgba(74,222,154,0.1);color:var(--accent);border:1px solid rgba(74,222,154,0.25);}
  .gap-badge.gap-zero{background:rgba(139,144,168,0.1);color:var(--text2);border:1px solid var(--border);}
  .metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .metric-card{background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border);}
  .metric-label{font-size:11px;color:var(--text3);margin-bottom:6px;}
  .metric-val{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--text);white-space:nowrap;}
  .metric-val.accent{color:var(--accent);}
  .metric-val.amber{color:var(--amber);}
  .metric-val.blue{color:var(--blue);}
  .chart-card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);margin-top:10px;}
  .chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;}
  .legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
  .legend-dot{width:10px;height:3px;border-radius:2px;}
  .legend-sq{width:10px;height:10px;border-radius:2px;}
  .chart-wrap{position:relative;height:240px;}
  
  .account-group{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);margin-bottom:12px;}
  .account-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
  .account-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .input-sub-box{display:flex;flex-direction:column;}
  .input-sub-box label{font-size:11px;color:var(--text2);margin-bottom:4px;}
  .number-input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;font-family:var(--mono);font-size:15px;color:var(--text);outline:none;transition:border-color .2s;}
  .number-input:focus{border-color:var(--accent);}
  .input-hint{font-size:10px;color:var(--text3);margin-top:4px;height:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  
  .calc-result-box{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:16px;margin-top:14px;}
  .calc-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;}
  .calc-row .cr-label{color:var(--text2);}
  .calc-row .cr-val{font-family:var(--mono);font-weight:500;}
  
  .slider-card{background:var(--card);border-radius:var(--radius);padding:18px 16px;border:1px solid var(--border);margin-bottom:10px;}
  .slider-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;}
  .slider-name{font-size:13px;color:var(--text2);}
  .slider-val{font-family:var(--mono);font-size:18px;font-weight:500;color:var(--text);}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;background:var(--bg);border-radius:2px;outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid var(--bg2);box-shadow:0 0 0 1px var(--accent2);transition:transform .15s;}
  input[type=range]::-webkit-slider-thumb:active{transform:scale(1.2);}
  .slider-minmax{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:5px;}
  
  .btn-primary{width:100%;padding:15px;background:var(--accent);color:#0a1a12;font-family:var(--font);font-size:15px
